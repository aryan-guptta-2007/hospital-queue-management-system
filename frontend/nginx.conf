server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change under the same name
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The shell and the service worker must not be cached, or an update can
    # never reach a tablet that is always on
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # The API, same origin, so no CORS and no mixed-content surprises
    location /api/ {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The backend trusts this for its per-IP rate limits
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The live queue feed needs the upgrade headers to survive the hop
    location /ws {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Single-page app: /track/<code> and /admin/* are routes, not files
    location / {
        try_files $uri $uri/ /index.html;
    }
}
